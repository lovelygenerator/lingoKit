# ftl-check configuration (https://github.com/lovelygenerator/ftl-check)
# lingokit-build checks the FTL files with it on every build; the `ftl-check` command gives the same result.
path = "locales/{locale}/**/*.ftl"
base = "en"

# Example: keys whose translation is the same as English on purpose, excluded from W502 (untranslated)
# [allow]
# untranslated = ["cli-*-value-json"]
