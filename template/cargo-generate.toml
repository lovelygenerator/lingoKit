[template]
cargo_generate_version = ">=0.21.0"
# Rust ソースと FTL は Liquid で処理しない
exclude = ["crates/*/src/**", "crates/*/tests/**", "locales/**"]
ignore = ["target", "hooks", "private"]

[placeholders]
with_cli = { type = "bool", prompt = "CLI(clap)クレートを生成しますか?", default = true }
with_mcp = { type = "bool", prompt = "MCP サーバー(rmcp)クレートを生成しますか?", default = true }
lingokit_git = { type = "string", prompt = "lingokit の git リポジトリ URL", default = "https://github.com/lovelygenerator/lingokit" }

[hooks]
# env_prefix の既定値(crate_name の大文字)を決める。-d env_prefix=FOO で上書きできる。
pre = ["hooks/pre.rhai"]

[conditional.'with_cli == false']
ignore = ["crates/cli", "locales/en/cli.ftl", "locales/ja/cli.ftl"]

[conditional.'with_mcp == false']
ignore = ["crates/mcp", "locales/en/mcp.ftl", "locales/ja/mcp.ftl"]
