[template]
cargo_generate_version = ">=0.21.0"
# Rust sources and FTL files are copied without Liquid processing
exclude = ["crates/*/src/**", "crates/*/tests/**", "locales/**"]
ignore = ["target", "hooks", "private"]

[placeholders]
with_cli = { type = "bool", prompt = "Generate the CLI crate (clap)?", default = true }
with_mcp = { type = "bool", prompt = "Generate the MCP server crate (rmcp)?", default = true }
lingokit_git = { type = "string", prompt = "Git repository of lingokit", default = "https://github.com/lovelygenerator/lingokit" }

[hooks]
# Sets the default env_prefix (crate_name in upper case). Override with -d env_prefix=FOO.
pre = ["hooks/pre.rhai"]

[conditional.'with_cli == false']
ignore = ["crates/cli", "locales/en/cli.ftl", "locales/ja/cli.ftl"]

[conditional.'with_mcp == false']
ignore = ["crates/mcp", "locales/en/mcp.ftl", "locales/ja/mcp.ftl"]
