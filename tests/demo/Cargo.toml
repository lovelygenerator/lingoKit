[package]
name = "lingokit-demo"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
lingokit = { path = "../../lingokit", features = ["clap", "rmcp"] }
clap = { version = "4.6", features = ["derive"] }
rmcp = { version = "~3.10", features = ["server", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
lingokit-build = { path = "../../lingokit-build" }
